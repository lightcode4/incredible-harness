# Builds the TypeScript/Bun + Tauri desktop app (the engine port).
# Separate from the Python build.yml; publishes under its own ts-build-<n> release tag
# so the two toolchains don't fight over the same tag while the port is in progress.
name: LightCode⁴ (TS · Bun + Tauri)

on:
  workflow_dispatch:
  push:
    paths:
      - "tsengine/**"
      - ".github/workflows/build-ts.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tsengine/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('tsengine/src-tauri/Cargo.toml') }}

      - name: Install engine deps
        working-directory: tsengine
        run: bun install

      - name: Typecheck engine
        working-directory: tsengine
        run: bunx tsc --noEmit

      - name: Compile engine + stage UI
        working-directory: tsengine
        run: bun run prepare:tauri

      - name: Stamp build number
        working-directory: tsengine
        run: |
          node -e "const f='package.json';const p=require('./'+f);p.lc4_build='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2));"

      - name: Build Tauri app
        working-directory: tsengine
        env:
          LC4_BUILD: ${{ github.run_number }}
        run: bun run tauri build

      - name: Collect installer (macOS)
        if: matrix.name == 'mac'
        run: |
          BUILD=${{ github.run_number }}
          SRC=$(ls tsengine/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mkdir -p out && cp "$SRC" "out/LightCode4-ts-mac-build${BUILD}.dmg"

      - name: Collect installer (Windows)
        if: matrix.name == 'windows'
        run: |
          BUILD=${{ github.run_number }}
          SRC=$(ls tsengine/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          mkdir -p out && cp "$SRC" "out/LightCode4-ts-Setup-build${BUILD}.exe"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ts-build-${{ github.run_number }}
        run: |
          FILE=$(ls out/* 2>/dev/null || true)
          [ -n "$FILE" ] || { echo "No installer built"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --target "$GITHUB_SHA" --title "LightCode⁴ TS (build ${{ github.run_number }})" \
            --notes "TypeScript/Bun + Tauri build of LightCode⁴ (engine port, work in progress)." || sleep 10
          gh release upload "$TAG" $FILE --clobber
