<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incredible Herness</title>
<style>
:root {
  --bg: #faf9f5; --side: #f3f1ea; --panel: #ffffff; --text: #29261b; --muted: #77736a; --faint: #a8a49a;
  --line: #e8e5dc; --accent: #c6613f; --accent-hover: #b4532f; --accent-text: #fff;
  --user: #f0eee6; --code: #f5f4ef; --codeblock: #262624; --codetext: #eceae3;
  --ok: #3b7d4f; --bad: #b3362b; --warn: #9a6a10; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --side: #1f1e1d; --panel: #30302e; --text: #ecebe5; --muted: #a6a39b; --faint: #75726b;
    --line: #3d3c39; --accent: #d97757; --accent-hover: #e3896b; --accent-text: #1f1e1d;
    --user: #3a3936; --code: #3a3936; --codeblock: #1c1b1a; --codetext: #e8e6df;
    --ok: #79c495; --bad: #f2948a; --warn: #e5b65f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); display: flex; overflow: hidden;
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Sidebar */
aside { width: 260px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  padding: 14px 10px; gap: 4px; transition: margin .2s; }
aside.hidden { margin-left: -260px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-text); }
.logo svg { width: 17px; height: 17px; stroke-width: 2.2; }
.brand b { font-size: 17px; letter-spacing: -.01em; }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
  background: none; text-align: left; color: var(--text); }
.navbtn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.navbtn.newchat { color: var(--accent); font-weight: 600; }
.section { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; }
.chatitem { font-size: 14px; padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--text) 7%, transparent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.who { font-size: 12px; color: var(--muted); padding: 2px 10px 6px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* Main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; }
.iconbtn { border: 0; background: none; padding: 7px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
.folderpill { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 4px 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); max-width: 50%; overflow: hidden; }
.folderpill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#scroll { flex: 1; overflow-y: auto; }
.col { max-width: 760px; margin: 0 auto; padding: 0 24px; }
#log { display: flex; flex-direction: column; gap: 18px; padding: 8px 0 32px; }

/* Welcome */
#welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-bottom: 12vh; }
#welcome h1 { font-weight: 400; font-size: 38px; letter-spacing: -.02em; margin: 0 0 26px; display: flex; align-items: center; gap: 14px; }
#welcome h1 .logo { width: 38px; height: 38px; border-radius: 11px; }
#welcome h1 .logo svg { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; color: var(--muted); }
.chip:hover { color: var(--text); border-color: var(--faint); }
body.chatting #welcome { display: none; }
body:not(.chatting) #scroll { display: none; }

/* Composer */
.composer { width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); padding: 12px 12px 10px 16px; }
.composer:focus-within { border-color: var(--faint); }
#input { width: 100%; border: 0; outline: 0; resize: none; background: none; min-height: 28px; max-height: 240px; padding: 2px 0; }
#input::placeholder { color: var(--faint); }
.comp-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.modelpill { border: 0; background: none; font-size: 13px; color: var(--muted); padding: 5px 9px; border-radius: 8px; display: flex; gap: 5px; align-items: center; }
.modelpill:hover { background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
.send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
.send:hover { background: var(--accent-hover); }
.send:disabled { opacity: .35; cursor: default; }
.send.stop { background: var(--text); color: var(--bg); }
#dock { padding: 0 24px 18px; display: flex; justify-content: center; }
body:not(.chatting) #dock { display: none; }
.hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }

/* Messages */
.user { align-self: flex-end; background: var(--user); padding: 10px 16px; border-radius: 18px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.assistant { word-wrap: break-word; }
.assistant > :first-child { margin-top: 0; } .assistant > :last-child { margin-bottom: 0; }
.assistant p { margin: 0 0 12px; }
.assistant h1, .assistant h2, .assistant h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 600; line-height: 1.3; margin: 20px 0 8px; }
.assistant h1 { font-size: 22px; } .assistant h2 { font-size: 19px; } .assistant h3 { font-size: 16.5px; }
.assistant ul, .assistant ol { margin: 0 0 12px; padding-left: 24px; } .assistant li { margin: 3px 0; }
.assistant a { color: var(--accent); }
.assistant code { background: var(--code); padding: 1.5px 5px; border-radius: 5px; font-size: .88em; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.codeblock { background: var(--codeblock); color: var(--codetext); border-radius: 12px; margin: 0 0 14px; overflow: hidden; }
.codeblock header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 6px 12px; color: #a9a69e; background: rgba(255,255,255,.04); }
.codeblock header button { border: 0; background: none; color: #a9a69e; font-size: 12px; display: flex; gap: 4px; align-items: center; }
.codeblock header button:hover { color: #fff; }
.codeblock header svg { width: 14px; height: 14px; }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.codeblock code { background: none; padding: 0; font-size: inherit; color: inherit; }
.caret::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  margin-left: 4px; animation: pulse 1s infinite; vertical-align: middle; }
@keyframes pulse { 50% { opacity: .25; } }

/* Steps: thinking + tools */
details.step { border-radius: 12px; font-size: 14px; }
details.step > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 2px 0; user-select: none; }
details.step > summary::-webkit-details-marker { display: none; }
details.step > summary:hover { color: var(--text); }
details.step > summary .chev { transition: transform .15s; width: 14px; height: 14px; }
details.step[open] > summary .chev { transform: rotate(90deg); }
.thinkbody { color: var(--muted); font-size: 13.5px; white-space: pre-wrap; border-left: 2px solid var(--line); margin: 6px 0 0 6px; padding: 2px 0 2px 14px; max-height: 260px; overflow-y: auto; }
.toolcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
details.toolcard > summary { padding: 9px 12px; }
.toolcard .sum { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--code); color: var(--muted); flex: none; }
.badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.wait { color: var(--warn); }
.toolbody { border-top: 1px solid var(--line); }
.toolbody pre { margin: 0; padding: 10px 12px; max-height: 300px; overflow: auto; font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; background: var(--code); }
.toolbody pre + pre { border-top: 1px solid var(--line); }
.del { color: var(--bad); } .add { color: var(--ok); }
.approve { padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
.approve p { width: 100%; margin: 0 0 2px; font-size: 13.5px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 14px; font-size: 13.5px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-hover); }
.approve input { flex: 1; min-width: 160px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 10px; font-size: 13.5px; }
.notice { font-size: 13.5px; color: var(--warn); display: flex; gap: 8px; align-items: flex-start; }

/* Settings dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); padding: 0; width: min(520px, 92vw); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-head { display: flex; align-items: center; padding: 16px 20px 6px; }
.dlg-head h2 { margin: 0; font-size: 20px; font-weight: 500; flex: 1; }
.dlg-body { padding: 8px 20px 4px; display: grid; gap: 14px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 11px; }
.field small { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 4px; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.toggle small { display: block; color: var(--faint); font-size: 12px; }
.switch { position: relative; width: 40px; height: 23px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(17px); }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 20px; }
#dlgError { color: var(--bad); font-size: 13px; margin-right: auto; align-self: center; }

@media (max-width: 760px) { aside { position: absolute; z-index: 5; height: 100%; } #welcome h1 { font-size: 28px; } }
</style>
</head>

</svg>

<aside id="side">
  <div class="brand"><div class="logo"><svg><use href="#i-spark"/></svg></div><b class="serif">Incredible Herness</b></div>
  <button class="navbtn newchat" id="newchat"><svg><use href="#i-plus"/></svg>New chat</button>
  <div class="section">Current chat</div>
  <div class="chatitem" id="chatTitle">New conversation</div>
  <div class="side-foot">
    <div class="who"><span class="dot"></span><span id="who">Connecting…</span></div>
    <button class="navbtn" id="openSettings"><svg><use href="#i-gear"/></svg>Settings</button>
  </div>
</aside>

<main>
  <div class="topbar">
    <button class="iconbtn" id="toggleSide" title="Toggle sidebar"><svg><use href="#i-side"/></svg></button>
    <button class="folderpill" id="folderPill" title="Working folder"><svg><use href="#i-folder"/></svg><span id="folderName">…</span></button>
  </div>

  <section id="welcome">
    <h1 class="serif"><span class="logo"><svg><use href="#i-spark"/></svg></span><span id="greet">What are we building?</span></h1>
    <div class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask Incredible Herness to build, fix or explain something…"></textarea>
      <div class="comp-row">
        <button class="modelpill" id="modelPill"><span id="modelName">model</span><svg style="width:14px;height:14px"><use href="#i-down"/></svg></button>
        <button class="send" id="send" title="Send (Enter)" disabled><svg><use href="#i-up"/></svg></button>
      </div>
    </div>
    <div class="chips">
      <button class="chip">Explain what this folder contains</button>
      <button class="chip">Find and fix a bug</button>
      <button class="chip">Write tests for my code</button>
      <button class="chip">Build a small web page</button>
    </div>
  </section>

  <div id="scroll"><div class="col"><div id="log"></div></div></div>
  <div id="dock"></div>
</main>

<dialog id="settings">

  <div class="dlg-body">
    <div class="field"><label>Provider</label>
      <div class="seg" id="seg"><button data-v="claude">Claude</button><button data-v="openai">OpenAI / compatible</button><button data-v="local">Local</button></div>
    </div>

      <div class="field"><label>Model</label><input id="model" spellcheck="false"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const log = $("log");
let cur = null, curKind = null, busy = false, config = {}, provider = "claude";
const icon = n => `<svg><use href="#i-${n}"/></svg>`;

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const nearBottom = () => { const s = $("scroll"); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; };
function scroll(force) { const s = $("scroll"); if (force || nearBottom()) s.scrollTop = s.scrollHeight; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function add(node) { const stick = nearBottom(); log.appendChild(node); if (stick) scroll(true); return node; }
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- Markdown (escape first, then format) ----
function inline(s) {
  return esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(md) {
  const out = []; const parts = md.split(/^```/m);
  parts.forEach((part, i) => {
    if (i % 2) {
      const nl = part.indexOf("\n"); const lang = nl < 0 ? "" : part.slice(0, nl).trim(); const code = nl < 0 ? "" : part.slice(nl + 1).replace(/\n$/, "");
      out.push(`<div class="codeblock"><header><span>${esc(lang || "code")}</span><button class="copy">${icon("copy")}Copy</button></header><pre><code>${esc(code)}</code></pre></div>`);
      return;
    }
    let list = null, para = [];
    const flushP = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(x => `<li>${inline(x)}</li>`).join("")}</${list.t}>`); list = null; } };
    for (const line of part.split("\n")) {
      let m;
      if (!line.trim()) { flushP(); flushL(); }
      else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
      else if ((m = line.match(/^\s*[-*]\s+(.*)/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
        const t = /^\s*\d/.test(line) ? "ol" : "ul"; flushP(); if (list && list.t !== t) flushL(); list = list || { t, items: [] }; list.items.push(m[1]);
      } else { flushL(); para.push(line); }
    }
    flushP(); flushL();
  });
  return out.join("");
}
log.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  navigator.clipboard.writeText(b.closest(".codeblock").querySelector("code").textContent);
  b.innerHTML = icon("copy") + "Copied"; setTimeout(() => b.innerHTML = icon("copy") + "Copy", 1500);
});

// ---- Streaming blocks ----
function stream(kind, text) {
  if (curKind !== kind) {
    endBlock(); curKind = kind;
    if (kind === "thinking") {
      cur = add(el("details", "step", `<summary>${icon("brain")}<span>Thinking…</span><svg class="chev"><use href="#i-chev"/></svg></summary><div class="thinkbody"></div>`));
      cur._body = cur.querySelector(".thinkbody");
    } else { cur = add(el("div", "assistant caret")); cur._body = cur; }
    cur._raw = "";
  }
  cur._raw += text;
  if (kind === "assistant") cur.innerHTML = markdown(cur._raw); else { cur._body.textContent = cur._raw; cur._body.scrollTop = 1e9; }
  scroll();
}
function endBlock() {
  if (cur) { cur.classList.remove("caret"); if (curKind === "thinking") cur.querySelector("summary span").textContent = "Thought process"; }
  cur = null; curKind = null;
}
function setBusy(b) {
  busy = b; const s = $("send");
  s.classList.toggle("stop", b); s.innerHTML = icon(b ? "stop" : "up"); s.title = b ? "Stop" : "Send (Enter)";
  s.disabled = !b && !$("input").value.trim();
  if (!b) endBlock();
}

// ---- Tool steps ----
const tools = {};
const toolIcon = s => s.startsWith("$") ? "term" : /^(read|write|edit)/.test(s) ? "file" : "search";
function toolCard(ev, needsApproval) {
  endBlock();
  const card = add(el("details", "step toolcard",
    `<summary>${icon(toolIcon(ev.summary))}<span class="sum"></span><span class="badge ${needsApproval ? "wait" : ""}">${needsApproval ? "Needs approval" : "Running"}</span><svg class="chev"><use href="#i-chev"/></svg></summary><div class="toolbody"></div>`));
  card.querySelector(".sum").textContent = ev.summary;
  const body = card.querySelector(".toolbody");
  if (ev.old != null || ev.new != null) {
    const pre = el("pre");
    if (ev.old != null) pre.innerHTML += ev.old.split("\n").map(l => `<span class="del">- ${esc(l)}</span>`).join("\n") + "\n";
    if (ev.new != null) pre.innerHTML += ev.new.split("\n").map(l => `<span class="add">+ ${esc(l)}</span>`).join("\n");
    body.appendChild(pre);
  }
  if (ev.error) { card.querySelector(".badge").textContent = "Invalid"; card.querySelector(".badge").className = "badge bad"; }
  if (needsApproval) {
    card.open = true;
    const row = el("div", "approve", `<p>Allow Incredible Herness to run this?</p>`);
    const fb = el("input"); fb.placeholder = "Or tell it what to do instead…";
    const decide = d => { api("/api/approve", { id: ev.id, decision: d, feedback: fb.value }); row.remove();
      const b = card.querySelector(".badge"); b.className = "badge " + (d === "deny" ? "bad" : ""); b.textContent = d === "deny" ? "Denied" : "Running"; };
    const mk = (t, cls, d) => { const b = el("button", "btn " + cls, t); b.onclick = () => decide(d); return b; };
    row.append(mk("Allow", "primary", "allow"), mk("Always allow", "", "always"), mk("Deny", "", "deny"), fb);
    fb.onkeydown = e => { if (e.key === "Enter") decide("deny"); };
    card.appendChild(row); scroll(true);
  }
  if (ev.id) tools[ev.id] = card;
}
function toolResult(ev) {
  const card = tools[ev.id]; if (!card) return;
  const b = card.querySelector(".badge"); b.className = "badge " + (ev.error ? "bad" : "ok"); b.textContent = ev.error ? "Failed" : "Done";
  const lines = ev.output.trim().split("\n");
  const pre = el("pre"); pre.textContent = lines.slice(0, 60).join("\n") + (lines.length > 60 ? `\n… ${lines.length - 60} more lines` : "");
  card.querySelector(".toolbody").appendChild(pre);
  if (!ev.error) card.open = false;
}
function notice(text) { endBlock(); const n = add(el("div", "notice", icon("warn"))); n.appendChild(document.createTextNode(text)); }

// ---- Config ----
const BASES = { openai: "Default: api.openai.com. Use another URL for OpenRouter, Groq, Together…", local: "Default: Ollama at http://localhost:11434/v1 (LM Studio: http://localhost:1234/v1)" };
function setProvider(p) {
  provider = p; document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.v === p));
  $("effortField").hidden = p !== "claude"; $("baseField").hidden = p === "claude"; $("baseHint").textContent = BASES[p] || "";
}
function showConfig(c) {
  config = c;
  $("modelName").textContent = c.model + (c.provider === "claude" ? ` · ${c.effort}` : "");
  $("who").textContent = { claude: "Claude", openai: "OpenAI", local: "Local" }[c.provider] + " · " + c.model;
  const parts = (c.cwd || "").split(/[\\/]/).filter(Boolean); $("folderName").textContent = (parts.length > 2 ? "…/" : "/") + parts.slice(-2).join("/");
  $("folderPill").title = c.cwd;
}
function openSettings() {
  setProvider(config.provider || "claude"); $("model").value = config.model || ""; $("effort").value = config.effort || "high";
  $("baseurl").value = config.base_url || ""; $("cwd").value = config.cwd || ""; $("auto").checked = !!config.auto;
  $("key").value = ""; $("key").placeholder = config.api_key ? "Saved (leave empty to keep)" : "Paste your key"; $("dlgError").textContent = "";
  $("settings").showModal();
}
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { if (b.dataset.v !== provider) $("model").value = ""; setProvider(b.dataset.v); });
$("saveSettings").onclick = async () => {
  const body = { provider, model: $("model").value.trim(), effort: $("effort").value, base_url: $("baseurl").value.trim(), cwd: $("cwd").value.trim(), auto: $("auto").checked };
  if ($("key").value) body.api_key = $("key").value;
  try { await api("/api/config", body); $("settings").close(); } catch (e) { $("dlgError").textContent = e.message; }
};
$("cancelSettings").onclick = $("closeSettings").onclick = () => $("settings").close();
["openSettings", "modelPill", "folderPill"].forEach(id => $(id).onclick = openSettings);
$("toggleSide").onclick = () => $("side").classList.toggle("hidden");

// ---- Events from the engine ----
const es = new EventSource("/api/events?token=" + TOKEN);
es.onmessage = m => {
  const ev = JSON.parse(m.data);
  switch (ev.kind) {
    case "text": stream("assistant", ev.text); break;
    case "thinking": stream("thinking", ev.text); break;
    case "end_block": endBlock(); break;
    case "notice": notice(ev.text); if (/Setup needed/.test(ev.text) && !document.body.classList.contains("chatting")) openSettings(); break;
    case "tool": toolCard(ev, false); break;
    case "approve": toolCard(ev, true); break;
    case "tool_result": toolResult(ev); break;
    case "status": setBusy(ev.busy); break;
    case "config": showConfig(ev.config); break;
  }
};
es.onerror = () => { $("who").textContent = "Engine disconnected"; };

// ---- Composer ----
function dockComposer() { if (!$("dock").contains($("composer"))) { $("dock").appendChild($("composer")); $("dock").insertAdjacentHTML("beforeend", ""); } }
async function sendMsg() {
  if (busy) { api("/api/stop"); return; }
  const text = $("input").value.trim(); if (!text) return;
  if (!document.body.classList.contains("chatting")) { document.body.classList.add("chatting"); dockComposer(); $("chatTitle").textContent = text.slice(0, 60); }
  endBlock(); add(el("div", "user")).textContent = text; scroll(true);
  $("input").value = ""; autosize(); setBusy(true);
  try { await api("/api/send", { text }); } catch (e) { setBusy(false); notice(e.message); }
  $("input").focus();
}
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; if (!busy) $("send").disabled = !t.value.trim(); }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } });
$("send").onclick = sendMsg;
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("input").value = c.textContent; autosize(); $("input").focus(); });
$("newchat").onclick = async () => {
  if (busy) await api("/api/stop").catch(() => {});
  await api("/api/clear").catch(e => notice(e.message));
  log.innerHTML = ""; endBlock(); document.body.classList.remove("chatting");
  $("welcome").insertBefore($("composer"), $("welcome").querySelector(".chips")); $("chatTitle").textContent = "New conversation"; $("input").focus();
};
const h = new Date().getHours(); $("greet").textContent = h < 12 ? "Good morning. What are we building?" : h < 18 ? "Good afternoon. What are we building?" : "Good evening. What are we building?";
window.addEventListener("pywebviewready", () => { $("pick").hidden = false; $("pick").onclick = async () => { const p = await window.pywebview.api.pick_folder(); if (p) $("cwd").value = p; }; });
$("input").focus();
</script>
</body>
