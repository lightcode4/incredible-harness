[package]
name = "lightcode4"
version = "0.1.0"
description = "LightCode⁴ desktop (Tauri shell hosting the Bun engine)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
