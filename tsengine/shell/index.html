<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LightCode⁴</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #17130c; color: #f1e7cf;
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { height: 100%; display: grid; place-items: center; }
  .card { text-align: center; opacity: .85; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #dfbd69; display: inline-block;
    animation: p 1s ease-in-out infinite; }
  @keyframes p { 0%,100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <!-- This placeholder shows only for the instant before the engine window opens. -->
  <div class="wrap"><div class="card"><div class="dot"></div><p>Starting LightCode⁴…</p></div></div>
</body>
</html>
